<!DOCTYPE html>
<html lang="sv">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Kortbetalning</title>
    <link rel="stylesheet" href="cardpayment.css">
</head>
<body>

    <header class="payment-header">
        <div class="header-left">
            <button class="custom-hamburger" onclick="toggleMobileMenu()" aria-label="Öppna meny">
                <span></span>
                <span></span>
                <span></span>
            </button>

            <a href="ShoppingCart2.html" class="logo-cart">🛒</a>
            <h1 class="restaurant-name">Vår restaurang</h1>
        </div>

        <nav class="header-right">
            <a href="Slut.html">Home</a>
            <a href="index.html">Food</a>
            <a href="about.html">About us</a>
            <a href="Login.html" class="btn-active-teal">Login</a>
        </nav>

        <div id="mobile-menu" class="mobile-nav">
            <a href="Slut.html">Home</a>
            <a href="index.html">Food</a>
            <a href="about.html">About us</a>
            <a href="ShoppingCart2.html">Kundvagn</a>
            <a href="Login.html">Login</a>
        </div>
    </header>

    <main class="payment-page">
        <section class="payment-card">
            <div class="payment-top">
                <div>
                    <p class="eyebrow">Säker kortbetalning</p>
                    <h2>Fyll i dina kortuppgifter</h2>
                    <p class="subtext">Belopp att betala: <strong id="order-total">458 kr</strong></p>
                </div>

                <div class="card-icons">💳 Visa · Mastercard · Maestro</div>
            </div>

            <form id="card-form" class="payment-form">
                <label for="cardName">Namn på kort</label>
                <input type="text" id="cardName" autocomplete="cc-name" required>

                <label for="cardNumber">Kortnummer</label>
                <input type="text" id="cardNumber" inputmode="numeric" autocomplete="cc-number" placeholder="1234 5678 9012 3456" required>

                <div class="form-row">
                    <div>
                        <label for="expiry">Giltigt till</label>
                        <input type="text" id="expiry" inputmode="numeric" autocomplete="cc-exp" placeholder="MM/ÅÅ" required>
                    </div>

                    <div>
                        <label for="cvc">Security code</label>
                        <input type="text" id="cvc" inputmode="numeric" autocomplete="cc-csc" placeholder="123" required>
                    </div>
                </div>

                <label for="email">E-post för kvitto</label>
                <input type="email" id="email" autocomplete="email" placeholder="namn@email.com" required>

                <div class="payment-actions">
                    <a href="ShoppingCart2.html" class="secondary-btn">Tillbaka</a>
                    <button type="submit" class="primary-btn">Betala nu</button>
                </div>
            </form>
        </section>
    </main>

    <script>
        function toggleMobileMenu() {
            const menu = document.getElementById("mobile-menu");
            menu.style.display = menu.style.display === "flex" ? "none" : "flex";
        }

        const total = localStorage.getItem("orderTotal") || "458 kr";
        document.getElementById("order-total").textContent = total;

        document.getElementById("card-form").addEventListener("submit", function (e) {
            e.preventDefault();
            window.location.href = "confirmation.html";
        });
    </script>
</body>
</html>
