<!DOCTYPE html>
<html lang="sv">
<head>
    <meta charset="UTF-8"> <!-- tecken -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0"> <!-- mobil -->
    <title>Login</title> <!-- titel -->
    <link rel="stylesheet" href="login.css"> <!-- css -->
</head>
<body class="login-page-body">

    <!-- toppbar -->
    <nav class="login-topbar">
        <div class="login-topbar-left">
            <button class="login-menu-btn" type="button" aria-label="Öppna meny"> <!-- meny -->
                <span></span>
                <span></span>
                <span></span>
            </button>

            <div class="login-cart-icon">🛒</div> <!-- ikon -->
        </div>

        <div class="login-brand">(Namn på vår restaurang)</div> <!-- namn -->

        <div class="login-topbar-nav"> <!-- länkar -->
            <a href="Slut.html">Home</a>
            <a href="#">Food</a>
            <a href="Slut3.html">About us</a>
            <a href="Login.html" class="active">Login</a>
        </div>
    </nav>

    <!-- innehåll -->
    <main class="login-main">
        <section class="login-card">
            <div class="login-header">
                <div class="login-user-icon">👤</div> <!-- ikon -->
                <p>Enter your info to log in to your account</p> <!-- text -->
            </div>

            <form class="login-form" onsubmit="checkLogin(event)"> <!-- form -->
                <label for="username">Email</label> <!-- label -->
                <input type="text" id="username" name="username" required> <!-- email -->

                <label for="password">Password:</label> <!-- label -->
                <input type="password" id="password" name="password" required> <!-- lösen -->

                <button type="submit" class="login-submit-btn">Log in</button> <!-- knapp -->

                <p id="loginMessage" class="login-message"></p> <!-- text -->

                <div class="login-signup">
                    <p>Dont have an account?</p>
                    <a href="#">sign in</a>
                </div>
            </form>
        </section>
    </main>

    <script>
        function checkLogin(event) { // login
            event.preventDefault(); // stoppa

            const username = document.getElementById("username").value.trim(); // namn
            const password = document.getElementById("password").value.trim(); // lösen
            const loginMessage = document.getElementById("loginMessage"); // text

            if (username === "test" && password === "123") { // rätt
                localStorage.setItem("adminAccess", "true"); // spara
                loginMessage.style.color = "green"; // grön
                loginMessage.textContent = "Inloggning lyckades..."; // text

                setTimeout(() => { // väntan
                    window.location.href = "adminpage.html"; // vidare
                }, 700);
            } else { // fel
                localStorage.removeItem("adminAccess"); // rensa
                loginMessage.style.color = "#b14b4b"; // röd
                loginMessage.textContent = "Fel användarnamn eller lösenord."; // text
            }
        }
    </script>
</body>
</html>
