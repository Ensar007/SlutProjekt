<!DOCTYPE html>
<html lang="sv">
<head>
    <meta charset="UTF-8"> <meta name="viewport" content="width=device-width, initial-scale=1.0"> <title>Login</title> <link rel="stylesheet" href="Login.css"> </head>
<body class="login-page-body">

    <aside class="login-side-menu" id="loginSideMenu">
        <div class="login-side-header">
            <h2>Menu</h2> <button class="login-close-menu" id="loginCloseMenu" aria-label="Stäng meny">&times;</button> </div>

        <nav class="login-side-links">
            <a href="Slut.html">Home</a> <a href="index.html">Food</a> <a href="about.html">About us</a> <a href="Login.html">Login</a> <a href="adminpage.html" id="loginAdminLink" style="display: none;">Admin Panel</a> 
        </nav>
    </aside>

    <div class="login-menu-overlay" id="loginMenuOverlay"></div>

    <nav class="login-topbar">
        <div class="login-topbar-left">
            <button class="login-menu-btn" id="loginOpenMenu" type="button" aria-label="Öppna meny"> <span></span>
                <span></span>
                <span></span>
            </button>

            <a href="ShoppingCart2.html" style="text-decoration: none; font-size: 20px;">🛒</a> </div>

        <div class="login-brand">(Namn på vår restaurang)</div> <div class="login-topbar-nav"> <a href="Slut.html">Home</a>
            <a href="index.html">Food</a>
            <a href="about.html">About us</a>
            <a href="Login.html" id="loginHeaderBtn" class="active">Login</a> </div>
    </nav>

    <main class="login-main">
        <section class="login-card">
            <div class="login-header">
                <div class="login-user-icon">👤</div> <p>Enter your info to log in to your account</p> </div>

            <form class="login-form"> 
                <label for="username">Email</label> <input type="text" id="username" name="username" required> <label for="password">Password:</label> <input type="password" id="password" name="password" required> <button type="submit" class="login-submit-btn">Log in</button> <p id="loginMessage" class="login-message"></p> <div class="login-signup">
                    <p>Don't have an account?</p>
                    <a href="signup.html">Sign up here</a>
                </div>
            </form>
        </section>
    </main>

    <script>
        const loginOpenMenu = document.getElementById("loginOpenMenu"); 
        const loginCloseMenu = document.getElementById("loginCloseMenu"); 
        const loginSideMenu = document.getElementById("loginSideMenu"); 
        const loginMenuOverlay = document.getElementById("loginMenuOverlay"); 
        const loginAdminLink = document.getElementById("loginAdminLink"); 
        const loginHeaderBtn = document.getElementById("loginHeaderBtn");

        // Öppna och stäng sidomeny
        loginOpenMenu.addEventListener("click", () => { 
            loginSideMenu.classList.add("active"); 
            loginMenuOverlay.classList.add("active"); 
        });

        loginCloseMenu.addEventListener("click", () => { 
            loginSideMenu.classList.remove("active"); 
            loginMenuOverlay.classList.remove("active"); 
        });

        loginMenuOverlay.addEventListener("click", () => { 
            loginSideMenu.classList.remove("active"); 
            loginMenuOverlay.classList.remove("active"); 
        });

        // Kontrollera inloggningsstatus när sidan laddas
        document.addEventListener("DOMContentLoaded", () => {
            const token = localStorage.getItem("token");
            const isAdmin = localStorage.getItem("adminAccess") === "true";

            // Om admin är inloggad, visa admin-länkar
            if (isAdmin) {
                if (loginAdminLink) loginAdminLink.style.display = "block";
            }

            // Hantera "Logga ut"-funktionen i headern
            if (token && loginHeaderBtn) {
                loginHeaderBtn.textContent = "Logga ut";
                loginHeaderBtn.href = "#";
                
                loginHeaderBtn.addEventListener("click", (e) => {
                    e.preventDefault();
                    localStorage.removeItem("token");
                    localStorage.removeItem("adminAccess");
                    alert("Du har loggats ut!");
                    window.location.reload(); // Laddar om sidan så menyn uppdateras
                });
            }
        });
    </script>

    <script src="Login.js"></script>
</body>
</html>
