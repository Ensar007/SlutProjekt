<!DOCTYPE html>
<html lang="sv">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Varukorg - Vår Restaurang</title>
    <link rel="stylesheet" href="ShoppingCart2.css">
</head>
<body>

    <header class="global-header">
        <div class="header-left">
            <button class="custom-hamburger" onclick="toggleMobileMenu()">
                <span></span><span></span><span></span>
            </button>
            <a href="ShoppingCart2.html" class="logo-cart">🛒</a>
            <h1 class="restaurant-name">Vår restaurang</h1>
        </div>

        <nav class="header-right">
            <a href="Slut.html">Home</a>
            <a href="index.html">Food</a>
            <a href="about.html">About us</a>
            <a href="Login.html" class="btn-active-teal">Login</a>
        </nav>

        <div id="mobile-menu" class="mobile-nav">
            <a href="Slut.html">Home</a>
            <a href="index.html">Food</a>
            <a href="about.html">About us</a>
            <a href="ShoppingCart2.html" style="color: var(--brand-teal);">Kundvagn</a>
            <a href="Login.html">Login</a>
        </div>
    </header>

    <main class="cart-page">
        <h2 class="page-title">Din Varukorg</h2>

        <div class="cart-layout">
            <section class="cart-items-section">
                <table class="cart-table">
                    <thead>
                        <tr>
                            <th>Produkt</th>
                            <th>Pris</th>
                            <th>Antal</th>
                            <th>Totalt</th>
                            <th></th>
                        </tr>
                    </thead>
                    <tbody id="cart-body">
                    </tbody>
                </table>
            </section>

            <aside class="checkout-sidebar">
                <div class="summary-card">
                    <h3 style="margin-bottom: 20px;">Orderöversikt</h3>
                    <div class="summary-row"><span>Delsumma</span><span id="cart-subtotal">0 kr</span></div>
                    <div class="summary-row"><span>Leveransavgift</span><span id="cart-delivery">0 kr</span></div>
                    <hr style="border: 0; border-top: 1px solid #eee; margin: 15px 0;">
                    <div class="summary-row total"><span>Totalt att betala</span><span id="cart-total">0 kr</span></div>

                    <div style="margin-top: 25px;">
                        <h4 style="margin-bottom: 15px; font-size: 0.9rem; color: #888;">BETALSÄTT</h4>

                        <label class="payment-option">
                            <input type="radio" name="payment" value="swish" checked>
                            <div>
                                <span style="font-weight: bold;">Swish</span><br>
                                <span style="font-size: 12px; color: #666;">Betala direkt med mobilen</span>
                            </div>
                        </label>

                        <label class="payment-option">
                            <input type="radio" name="payment" value="card">
                            <div>
                                <span style="font-weight: bold;">Betalkort</span><br>
                                <span style="font-size: 12px; color: #666;">Visa, Mastercard, Maestro</span>
                            </div>
                        </label>
                    </div>

                    <button id="checkout-btn" class="place-order-btn">Slutför köp (0 kr)</button>
                </div>
            </aside>
        </div>
    </main>

    <script>
        // Enkel funktion för att visa/dölja mobilmenyn
        function toggleMobileMenu() {
            const m = document.getElementById('mobile-menu');
            m.style.display = m.style.display === 'flex' ? 'none' : 'flex';
        }

        document.addEventListener("DOMContentLoaded", () => {
            const cartBody = document.getElementById('cart-body');
            const deliveryFee = 39; // Fast leveransavgift

            // HÄMTA DATAN: Öppnar webbläsarens minne ("localStorage") och hämtar det som "Food"-sidan sparade!
            let cart = JSON.parse(localStorage.getItem('cart')) || [];

            // HUVUDFUNKTION: Ritar upp varukorgen. Denna körs varje gång vi ändrar något.
            function renderCart() {
                cartBody.innerHTML = ''; // Rensar tabellen först så vi kan rita upp den på nytt
                let subtotal = 0;

                // Om varukorgen är tom, visa ett meddelande
                if (cart.length === 0) {
                    cartBody.innerHTML = '<tr><td colspan="5" style="text-align:center; padding: 20px;">Din varukorg är tom. Gå till Food för att handla!</td></tr>';
                } else {
                    // Loopar igenom varje produkt i vår varukorg
                    cart.forEach((item, index) => {
                        let itemTotal = item.price * item.quantity; // Räknar ut totalpris för just denna rad
                        subtotal += itemTotal; // Lägger till i totalsumman

                        // Skriver ut HTML-koden för raden. Använder backticks (`) för att kunna stoppa in variabler (t.ex. ${item.name})
                        cartBody.innerHTML += `
                            <tr class="cart-item">
                                <td class="product-info">
                                    <div class="product-img-placeholder">🍽️</div>
                                    <div>
                                        <p class="product-name" style="font-weight:bold;">${item.name}</p>
                                    </div>
                                </td>
                                <td class="unit-price">${item.price} kr</td>
                                <td>
                                    <div class="quantity-picker">
                                        <button class="qty-btn minus" data-index="${index}">-</button>
                                        <span class="qty-value">${item.quantity}</span>
                                        <button class="qty-btn plus" data-index="${index}">+</button>
                                    </div>
                                </td>
                                <td class="subtotal-price">${itemTotal} kr</td>
                                <td><button class="remove-item" data-index="${index}">✕</button></td>
                            </tr>
                        `;
                    });
                }

                // Beräkna kostnader. Ingen mat = ingen leveransavgift.
                const currentDelivery = subtotal > 0 ? deliveryFee : 0;
                const total = subtotal + currentDelivery;

                // Uppdaterar siffrorna i orderöversikten (på höger sida)
                document.getElementById('cart-subtotal').textContent = subtotal + ' kr';
                document.getElementById('cart-delivery').textContent = currentDelivery + ' kr';
                document.getElementById('cart-total').textContent = total + ' kr';
                document.getElementById('checkout-btn').textContent = `Slutför köp (${total} kr)`;

                // Spara de nya ändringarna tillbaka till webbläsarens minne
                localStorage.setItem('cart', JSON.stringify(cart));
            }

            // EVENT-LYSSNARE FÖR TABELLEN: Lyssnar om man klickar på plus, minus eller ta bort (kryss)
            cartBody.addEventListener('click', (e) => {
                const index = e.target.getAttribute('data-index');

                if (index !== null) {
                    if (e.target.classList.contains('remove-item')) {
                        cart.splice(index, 1); // Tar bort produkten helt från listan
                    }

                    if (e.target.classList.contains('plus')) {
                        cart[index].quantity += 1; // Ökar antalet
                    }

                    if (e.target.classList.contains('minus')) {
                        if (cart[index].quantity > 1) {
                            cart[index].quantity -= 1; // Minskar antalet
                        } else {
                            cart.splice(index, 1); // Om antalet var 1 och man trycker minus, ta bort produkten
                        }
                    }

                    renderCart(); // Rita upp tabellen på nytt med de nya siffrorna!
                }
            });

            // KNAPP FÖR BETALNING: Hanterar vad som händer när man trycker på "Slutför köp"
            document.getElementById('checkout-btn').addEventListener('click', () => {
                if (cart.length === 0) {
                    alert("Varukorgen är tom!");
                    return; // Avbryter funktionen så vi inte går vidare till betalning
                }

                // Kollar vilket betalsätt som är ikryssat
                const selectedPayment = document.querySelector('input[name="payment"]:checked').value;
                const totalText = document.getElementById('cart-total').textContent;

                // Sparar totalsumman i minnet så att betalsidan kan visa hur mycket man ska betala
                localStorage.setItem('orderTotal', totalText);

                // Skickar användaren till rätt betalsida beroende på valt alternativ
                if (selectedPayment === 'swish') {
                    window.location.href = 'swishpayment.html';
                } else {
                    window.location.href = 'cardpayment.html';
                }
            });

            // Kallar på funktionen en första gång när sidan laddas för att rita upp innehållet
            renderCart();
        });
    </script>
</body>
</html>
